[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group4-selective-surveillance"
version = "0.1.0"
description = "Python real-time restricted-zone monitoring and scenario evaluation project"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "streamlit>=1.53,<2",
    "streamlit-drawable-canvas==0.13.0",
    "Pillow>=10,<13",
    "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
